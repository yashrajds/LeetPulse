name: daily-leetpulse
on:
  schedule:
    - cron: '0 1 * * *'  # ~06:30 IST
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "$BACKEND_URL/api/automation/run" \
            -H 'Content-Type: application/json' \
            ${API_TOKEN:+-H "Authorization: Bearer $API_TOKEN"} \
            -d '{"trigger":"github-actions"}'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
